<!DOCTYPE html>
<html>
    <head>
        <title>人类语-教程</title>
        <meta charset="utf-8"/>
        <link rel="stylesheet" type="text/css" href="./CSS/font.css"/>
        <link rel="stylesheet" type="text/css" href="./CSS/cor.css"/>
    </head>
    <body>
        <div id="topbase"></div>
        <div id="top">
        <span id="toptext0">输入课程进度代码：</span><input type="text" maxlength="2" id="toptext"/>
        <p id="toptext1">当前的课程进度代码为：</p>
        <p id="toptext2">若网页未保存或丢失课程进度，可输入进度代码以找回。</p>
        <input type="button" value="&#xe04c;" id="button0"/>
        </div>
        <input type="button" value="返回主页" id="button1"/>

        <div id="course">
            <input type="button" value="你好，人类!" id="course0"/>
            <input type="button" value="我是一个土豆" id="course1"/>
            <input type="button" value="咖啡或茶" id="course2"/>
            <input type="button" value="老鼠是什么颜色的?" id="course3"/>
            <input type="button" value="过去，现在，未来" id="course4"/>

            <div id="line">
                <svg id="line0"></svg>
                <svg id="line1"></svg>
                <svg id="line2"></svg>
                <svg id="line3"></svg>
            </div>
        </div>

        


        <div id="whitemask0"></div>
        <div id="whitemask1"></div>
    </body>
    <script src="./JS/cor.js"></script>
</html>

<!--如果要新加课程，要加course按钮，line，course按钮的CSS，还要改line的CSS高度，以免svg画不出来-->
